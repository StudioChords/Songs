<script>
  const titleEl = document.getElementById('songTitle');
  const contentEl = document.getElementById('songContent');
  const btn = document.getElementById('startBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  let scrollDurationSeconds = 180;
  let scrolling = false;
  let rafId = null;

  function showWaiting() {
    titleEl.textContent = 'Waiting for song…';
    titleEl.classList.add('waiting');
    contentEl.textContent = 'No song has been uploaded yet. Once song.html is added to this\nsite, it\'ll show up here automatically — hit Refresh to check.';
    contentEl.classList.add('waiting');
    btn.disabled = true;
  }

  function showSong(title, duration, content) {
    titleEl.textContent = title;
    titleEl.classList.remove('waiting');
    contentEl.textContent = content;
    contentEl.classList.remove('waiting');
    scrollDurationSeconds = duration;
    btn.disabled = false;
  }

  async function loadSong() {
    try {
      // ✅ Bypasses the GitHub Pages build delay completely!
      const rawUrl = 'https://raw.githubusercontent.com/StudioChords/Songs/main/song.html?t=' + Date.now();
      
      const res = await fetch(rawUrl, { cache: 'no-store' });
      if (!res.ok) {
        showWaiting();
        return;
      }
      const raw = await res.text();
      if (!raw.trim()) {
        showWaiting();
        return;
      }

      const lines = raw.split('\n');
      const title = (lines[0] || '').trim() || 'Untitled';
      const duration = parseInt((lines[1] || '').trim(), 10);
      const content = lines.slice(2).join('\n').replace(/^\n+/, '');

      showSong(title, isNaN(duration) ? 180 : duration, content);
    } catch (err) {
      showWaiting();
    }
  }

  function startScroll() {
    if (scrolling || btn.disabled) return;
    scrolling = true;
    btn.textContent = 'Scrolling…';
    btn.classList.add('playing');

    const startY = window.scrollY;
    const maxY = document.body.scrollHeight - window.innerHeight;
    const startTime = performance.now();

    function step(now) {
      const elapsed = (now - startTime) / 1000;
      const progress = Math.min(elapsed / scrollDurationSeconds, 1);
      window.scrollTo(0, startY + progress * (maxY - startY));
      if (progress < 1) {
        rafId = requestAnimationFrame(step);
      } else {
        scrolling = false;
        btn.textContent = 'Play';
        btn.classList.remove('playing');
      }
    }
    rafId = requestAnimationFrame(step);
  }

  function resetScroll() {
    cancelAnimationFrame(rafId);
    scrolling = false;
    window.scrollTo(0, 0);
    btn.textContent = 'Play';
    btn.classList.remove('playing');
  }

  btn.addEventListener('click', () => {
    if (scrolling) {
      resetScroll();
    } else {
      startScroll();
    }
  });

  refreshBtn.addEventListener('click', () => {
    resetScroll();
    loadSong();
  });

  loadSong();
</script>
