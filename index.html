<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: #101014;
    color: #eee;
  }
  header {
    position: sticky;
    top: 0;
    background: #16161c;
    border-bottom: 1px solid #2a2a33;
    padding: 14px 20px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0;
    letter-spacing: 0.02em;
    text-align: center;
  }
  h1.waiting {
    color: #777;
    font-style: italic;
  }
  #startBtn {
    background: #2f6feb;
    color: white;
    border: none;
    padding: 10px 18px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
  }
  #startBtn.playing {
    background: #444;
  }
  #startBtn:disabled {
    background: #2a2a33;
    color: #666;
    cursor: not-allowed;
  }
  #refreshBtn {
    background: #2a2a33;
    color: #eee;
    border: 1px solid #3a3a44;
    padding: 10px 16px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
  }
  main {
    padding: 24px 20px 60vh;
    white-space: pre-wrap;
    font-size: 1.15rem;
    line-height: 1.9;
  }
  main.waiting {
    color: #666;
    font-style: italic;
    font-size: 1.1rem;
  }
  .chord {
    color: #6fbfff;
    font-weight: bold;
  }
</style>
</head>
<body>

<header>
  <button id="refreshBtn" title="Check for the latest uploaded song">⟳ Refresh</button>
  <h1 id="songTitle" class="waiting">Waiting for song…</h1>
  <button id="startBtn" disabled>Play</button>
</header>

<main id="songContent" class="waiting">
No song has been uploaded yet. Once song.html is added to this
site, it'll show up here automatically — hit Refresh to check.
</main>

<script>
  const titleEl = document.getElementById('songTitle');
  const contentEl = document.getElementById('songContent');
  const btn = document.getElementById('startBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  let scrollDurationSeconds = 180;
  let scrolling = false;
  let rafId = null;

  function showWaiting() {
    titleEl.textContent = 'Waiting for song…';
    titleEl.classList.add('waiting');
    contentEl.textContent = 'No song has been uploaded yet. Once song.html is added to this\nsite, it\'ll show up here automatically — hit Refresh to check.';
    contentEl.classList.add('waiting');
    btn.disabled = true;
  }

  function showSong(title, duration, content) {
    titleEl.textContent = title;
    titleEl.classList.remove('waiting');
    contentEl.textContent = content;
    contentEl.classList.remove('waiting');
    scrollDurationSeconds = duration;
    btn.disabled = false;
  }

  async function loadSong() {
    try {
      // Cache-bust so we always get the freshest upload, not a stale cached copy.
      const res = await fetch('song.html?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) {
        showWaiting();
        return;
      }
      const raw = await res.text();
      if (!raw.trim()) {
        showWaiting();
        return;
      }

      const lines = raw.split('\n');
      const title = (lines[0] || '').trim() || 'Untitled';
      const duration = parseInt((lines[1] || '').trim(), 10);
      const content = lines.slice(2).join('\n').replace(/^\n+/, '');

      showSong(title, isNaN(duration) ? 180 : duration, content);
    } catch (err) {
      showWaiting();
    }
  }

  function startScroll() {
    if (scrolling || btn.disabled) return;
    scrolling = true;
    btn.textContent = 'Scrolling…';
    btn.classList.add('playing');

    const startY = window.scrollY;
    const maxY = document.body.scrollHeight - window.innerHeight;
    const startTime = performance.now();

    function step(now) {
      const elapsed = (now - startTime) / 1000;
      const progress = Math.min(elapsed / scrollDurationSeconds, 1);
      window.scrollTo(0, startY + progress * (maxY - startY));
      if (progress < 1) {
        rafId = requestAnimationFrame(step);
      } else {
        scrolling = false;
        btn.textContent = 'Play';
        btn.classList.remove('playing');
      }
    }
    rafId = requestAnimationFrame(step);
  }

  function resetScroll() {
    cancelAnimationFrame(rafId);
    scrolling = false;
    window.scrollTo(0, 0);
    btn.textContent = 'Play';
    btn.classList.remove('playing');
  }

  btn.addEventListener('click', () => {
    if (scrolling) {
      resetScroll();
    } else {
      startScroll();
    }
  });

  refreshBtn.addEventListener('click', () => {
    resetScroll();
    loadSong();
  });

  loadSong();
</script>

</body>
</html>
